name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      # Coverage reporting starts advisory so converter outages cannot freeze merges.
      # Preserve the existing test gate and any established coverage threshold.
      - name: Generate Cobertura coverage (advisory)
        if: runner.os == 'Linux'
        id: cobertura
        continue-on-error: true
        shell: bash
        run: go run github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484 -strict < coverage.out > coverage.xml
      - name: Retain coverage reports (advisory)
        if: steps.cobertura.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.xml
          if-no-files-found: error
          retention-days: 14

      - run: go build ./...
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # No separate install step: `make lint`'s GOLANGCI_LINT variable
      # resolves the binary via `go run .../golangci-lint@version` (the Go
      # module proxy's checksum-verified fetch), the same command a
      # developer runs locally — one place pins the version, one place
      # defines the enforcing pipeline, so CI and local dev can't drift.
      - name: Tier 1a (enforcing) — make lint
        run: make lint
      # Tier 1b (govet/shadow) is intentionally never enforcing — 3 of its 5
      # current findings sit in pkg/config/pkg/git/pkg/jobs, out of scope for
      # #128/#129. Tracked in #132 so this deferral has an owner rather than
      # becoming a permanent unowned green checkmark.
      - name: Tier 1b (govet/shadow, non-enforcing — see #132)
        shell: bash
        run: |
          set +e
          output=$(make lint-shadow 2>&1)
          status=$?
          set -e
          {
            echo '```text'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit "$status"
        continue-on-error: true
