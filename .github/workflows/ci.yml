name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Keep existing branch-scoped caching outside the Windows pilot.
          # PR merge-ref caches cannot be restored by main or other PRs.
          # Windows uses separate stores and a trusted-main publisher below.
          cache: ${{ runner.os != 'Windows' }}
      - name: Prepare isolated Windows Go stores
        if: runner.os == 'Windows'
        id: go-cache
        shell: bash
        run: bash .github/scripts/go-cache.sh prepare
      - name: Restore Windows module downloads
        if: runner.os == 'Windows'
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .freshen-ci-cache/modules.tar
          key: ${{ steps.go-cache.outputs.modules }}
          restore-keys: ${{ steps.go-cache.outputs.modules-prefix }}
      - name: Restore Windows build objects
        if: runner.os == 'Windows'
        id: objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .freshen-ci-cache/build.tar
          key: ${{ steps.go-cache.outputs.build }}
          restore-keys: ${{ steps.go-cache.outputs.build-prefix }}
      - name: Validate and unpack Windows Go archives
        if: runner.os == 'Windows'
        shell: bash
        run: bash .github/scripts/go-cache.sh restore
        env:
          MODULE_PRIMARY: ${{ steps.modules.outputs.cache-primary-key }}
          MODULE_MATCHED: ${{ steps.modules.outputs.cache-matched-key }}
          MODULE_HIT: ${{ steps.modules.outputs.cache-hit }}
          BUILD_PRIMARY: ${{ steps.objects.outputs.cache-primary-key }}
          BUILD_MATCHED: ${{ steps.objects.outputs.cache-matched-key }}
          BUILD_HIT: ${{ steps.objects.outputs.cache-hit }}
      - run: go vet ./...
      - run: go test -race "-coverprofile=coverage.out" ./...
      # Coverage reporting starts advisory so converter outages cannot freeze merges.
      # Report generation is Linux-only; the conversion cannot reliably handle profiles
      # from other platforms. Artifacts named per-OS to avoid collisions in matrix runs.
      - name: Generate Cobertura coverage (advisory, Linux-only)
        if: runner.os == 'Linux'
        id: cobertura
        continue-on-error: true
        shell: bash
        run: |
          if go run github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484 < coverage.out > coverage.xml; then
            if ! test -s coverage.xml || ! grep -q '<coverage' coverage.xml; then
              echo "::warning::Cobertura conversion produced invalid output; skipping upload"
              exit 1
            fi
          else
            exit 1
          fi
      - name: Retain coverage reports (advisory, Linux-only)
        if: runner.os == 'Linux' && steps.cobertura.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ runner.os }}
          path: |
            coverage.out
            coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: go build ./...
      - name: Package successful trusted Windows caches
        if: success() && runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: publish-cache
        shell: bash
        run: bash .github/scripts/go-cache.sh publish
        env:
          JOB_STATUS: ${{ job.status }}
          MODULE_PRIMARY: ${{ steps.modules.outputs.cache-primary-key }}
          MODULE_MATCHED: ${{ steps.modules.outputs.cache-matched-key }}
          MODULE_HIT: ${{ steps.modules.outputs.cache-hit }}
          BUILD_PRIMARY: ${{ steps.objects.outputs.cache-primary-key }}
          BUILD_MATCHED: ${{ steps.objects.outputs.cache-matched-key }}
          BUILD_HIT: ${{ steps.objects.outputs.cache-hit }}
      - name: Save trusted Windows module downloads
        if: success() && runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publish-cache.outputs.modules == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .freshen-ci-cache/modules.tar
          key: ${{ steps.go-cache.outputs.modules }}
      - name: Save trusted Windows build objects
        if: success() && runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publish-cache.outputs.build == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .freshen-ci-cache/build.tar
          key: ${{ steps.go-cache.outputs.build }}
  vulnerabilities:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The shared go.sum-keyed cache never holds the linter's own
          # dependencies, so this job owns its Go stores via the steps below.
          cache: false
      # Caches only Go module downloads and build output (including the
      # `go run`-built golangci-lint executable). golangci-lint's analysis
      # cache (~/.cache/golangci-lint) is deliberately not cached, so every
      # run re-analyses the current checkout. Toolchain and linter version
      # are exact in every key; only lock/config inputs may fall back.
      - name: Compute lint tool cache key
        id: lint-cache
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::GOLANGCI_LINT_VERSION not found in Makefile"; exit 1; }
          prefix="lint-tools-v1-$RUNNER_OS-$RUNNER_ARCH-$(go env GOOS)-$(go env GOARCH)-$(go env GOVERSION)-golangci-lint-$version-"
          inputs=$(cat go.mod go.sum Makefile .golangci.yml .golangci-shadow.yml | sha256sum | cut -d ' ' -f 1)
          {
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "gocache=$(go env GOCACHE)"
            echo "prefix=$prefix"
            echo "key=$prefix$inputs"
          } >> "$GITHUB_OUTPUT"
      # PRs and merge queues only read; main-scoped entries come solely from
      # the trusted push-to-main save below.
      - name: Restore lint tool cache
        id: lint-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.lint-cache.outputs.gomodcache }}
            ${{ steps.lint-cache.outputs.gocache }}
          key: ${{ steps.lint-cache.outputs.key }}
          restore-keys: ${{ steps.lint-cache.outputs.prefix }}
      # No separate install step: `make lint`'s GOLANGCI_LINT variable
      # resolves the binary via `go run .../golangci-lint@version` (the Go
      # module proxy's checksum-verified fetch), the same command a
      # developer runs locally — one place pins the version, one place
      # defines the enforcing pipeline, so CI and local dev can't drift.
      - name: Tier 1a (enforcing) — make lint
        run: make lint
      - name: Save trusted lint tool cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lint-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.lint-cache.outputs.gomodcache }}
            ${{ steps.lint-cache.outputs.gocache }}
          key: ${{ steps.lint-cache.outputs.key }}
  # Surfaces .goreleaser.yaml errors and release-layout regressions on the PR,
  # not when a tag is pushed. Keep `version` in step with release.yml.
  release-config:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      # `goreleaser check` exits 2 for any deprecated property. `brews` is kept
      # deliberately (homebrew_casks is macOS-only; we ship a Linuxbrew formula),
      # so tolerate exactly that deprecation and fail on everything else.
      - name: goreleaser check
        shell: bash
        run: |
          rc=0
          goreleaser check 2>&1 | tee check.raw || rc=${PIPESTATUS[0]}
          # goreleaser ignores NO_COLOR; strip ANSI so the greps below match.
          sed 's/\x1b\[[0-9;]*m//g' check.raw > check.log
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 2 ] \
            && grep -q 'uses deprecated properties' check.log \
            && ! grep 'DEPRECATED:' check.log | grep -qv -E 'DEPRECATED: +brews '; then
            echo "::warning::only the known 'brews' deprecation remains"
            exit 0
          fi
          exit "$rc"
      - name: goreleaser snapshot build (no publish)
        run: goreleaser release --snapshot --clean --skip=publish
        env:
          # The tap token is templated into .goreleaser.yaml; snapshot runs never
          # use it, but an unset variable can fail template evaluation.
          HOMEBREW_TAP_GITHUB_TOKEN: snapshot-unused
      - name: Check generated formula and winget manifest
        shell: bash
        run: |
          set -euo pipefail
          formula=$(find dist -name freshen.rb)
          echo "formula: $formula"
          test "$formula" = dist/homebrew/Formula/freshen.rb
          ruby -c "$formula"
          grep -F 'license "Apache-2.0"' "$formula"
          grep -F 'assert_match "freshen v#{version}"' "$formula"
          version=$(jq -r .version dist/metadata.json)
          # RelativeFilePath in the winget manifest assumes the exe is at the archive root.
          unzip -Z1 "dist/freshen_${version}_windows_amd64.zip" | grep -Fx freshen.exe
          unzip -Z1 "dist/freshen_${version}_windows_arm64.zip" | grep -Fx freshen.exe
          scripts/winget-manifest.sh "v${version}" dist/checksums.txt dist/SeanKoji.Freshen.yaml
          cat dist/SeanKoji.Freshen.yaml
