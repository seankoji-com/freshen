name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: curl -sSfL --retry 3 --max-time 60 https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.2/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.2
      - name: golangci-lint run (Tier 1a, enforcing)
        run: golangci-lint run ./...
      - name: golangci-lint fmt (rewrites in place — run `make lint` locally and commit the result before pushing)
        run: golangci-lint fmt ./...
      - name: Fail if fmt changed the tree
        run: git diff --exit-code
      - name: Tier 1b (govet/shadow, non-enforcing)
        run: golangci-lint run -c .golangci-shadow.yml ./... 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
