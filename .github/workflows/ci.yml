name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f592a081ee6b706e325eaca11579433a81966c4d # v4.1.7
      - uses: actions/setup-go@0a12f3930d12edfb352702405f8d02aba3b51ccc # v5.0.7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race "-coverprofile=coverage.out" ./...
      # Coverage reporting starts advisory so converter outages cannot freeze merges.
      # Report generation is Linux-only; the conversion cannot reliably handle profiles
      # from other platforms. Artifacts named per-OS to avoid collisions in matrix runs.
      - name: Generate Cobertura coverage (advisory, Linux-only)
        if: runner.os == 'Linux'
        id: cobertura
        continue-on-error: true
        shell: bash
        run: |
          if go run github.com/boumenot/gocover-cobertura@4afa1205ab3b54ae098dd4724c1657aad10f7484 < coverage.out > coverage.xml; then
            if ! test -s coverage.xml || ! grep -q '<coverage' coverage.xml; then
              echo "::warning::Cobertura conversion produced invalid output; skipping upload"
              exit 1
            fi
          else
            exit 1
          fi
      - name: Retain coverage reports (advisory, Linux-only)
        if: runner.os == 'Linux' && steps.cobertura.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-${{ runner.os }}
          path: |
            coverage.out
            coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: go build ./...
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # No separate install step: `make lint`'s GOLANGCI_LINT variable
      # resolves the binary via `go run .../golangci-lint@version` (the Go
      # module proxy's checksum-verified fetch), the same command a
      # developer runs locally — one place pins the version, one place
      # defines the enforcing pipeline, so CI and local dev can't drift.
      - name: Tier 1a (enforcing) — make lint
        run: make lint
      # Tier 1b (govet/shadow) is intentionally never enforcing — 3 of its 5
      # current findings sit in pkg/config/pkg/git/pkg/jobs, out of scope for
      # #128/#129. Tracked in #132 so this deferral has an owner rather than
      # becoming a permanent unowned green checkmark.
      - name: Tier 1b (govet/shadow, non-enforcing — see #132)
        shell: bash
        run: |
          set +e
          output=$(make lint-shadow 2>&1)
          status=$?
          set -e
          {
            echo '```text'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit "$status"
        continue-on-error: true
