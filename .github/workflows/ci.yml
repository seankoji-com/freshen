name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Build binary
        # `--always` falls back to the abbreviated commit SHA and never fails,
        # so no "|| echo" fallback is needed here. VERSION is captured as its
        # own statement (not inlined into -ldflags) so that if git itself
        # ever errors here, -e fails the step loudly instead of silently
        # shipping a binary with an empty -X main.Version=.
        # Note: if a v-prefixed tag is ever created, main.go's version-print
        # format already adds its own "v" prefix, which would double up.
        run: |
          VERSION="$(git describe --tags --always)"
          go build -ldflags "-X main.Version=$VERSION" -o freshen .
