name: CodeQL analysis (free)

# Free CodeQL for private repos: runs the CodeQL CLI on self-hosted X64 runners
# and saves the SARIF as a workflow artifact. Does NOT upload to GitHub code
# scanning (that requires the paid GitHub Code Security add-on for private
# repos), so there is no Security-tab integration — review findings via the
# artifact + the per-run "Findings summary" in the job summary.
#
# build-mode: autobuild — CodeQL 2.26+ rejects build-mode none for Go, so the
# job installs Go (setup-go, version from go.mod) and lets CodeQL autobuild.
# CodeQL CLI has no linux/arm64 build, so this is pinned to X64 runners only.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Do not upload to code scanning (needs paid Code Security on private
          # repos). SARIF is written to `output` and archived below instead.
          upload: never
          output: sarif-results
          category: "/language:${{ matrix.language }}"

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30
          if-no-files-found: warn

      - name: Findings summary
        shell: bash
        run: |
          sarif="$(find sarif-results -name '*.sarif' -print -quit 2>/dev/null)"
          if [ -n "$sarif" ]; then
            total="$(jq '[.runs[].results[]] | length' "$sarif" 2>/dev/null || echo 0)"
            echo "### CodeQL findings (${{ matrix.language }}): ${total}" >> "$GITHUB_STEP_SUMMARY"
            jq -r '[.runs[].results[] | .level] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' "$sarif" 2>/dev/null | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            echo "- SARIF artifact: codeql-sarif-${{ matrix.language }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### CodeQL (${{ matrix.language }}): no SARIF produced" >> "$GITHUB_STEP_SUMMARY"
          fi
