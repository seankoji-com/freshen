name: CodeQL analysis (free)

# Free CodeQL for private repos: runs the CodeQL CLI on self-hosted X64 runners
# and saves the SARIF as a workflow artifact. Does NOT upload to GitHub code
# scanning (that requires the paid GitHub Code Security add-on for private
# repos), so there is no Security-tab integration — review findings via the
# artifact + the per-run "Findings summary" in the job summary.
#
# build-mode: autobuild — CodeQL 2.26+ rejects build-mode none for Go, so the
# job installs Go (setup-go, version from go.mod) and lets CodeQL autobuild.
# CodeQL CLI has no linux/arm64 build, so this is pinned to X64 runners only.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: true
          category: "/language:${{ matrix.language }}"
