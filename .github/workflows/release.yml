name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Unix archives (macOS and Linux)
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          PLATFORMS=("darwin/arm64" "darwin/amd64" "linux/arm64" "linux/amd64")

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            OUTPUT_DIR="dist/freshen_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "$OUTPUT_DIR"
            
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-X main.Version=${VERSION}" -o "${OUTPUT_DIR}/freshen" .
            cp LICENSE README.md "$OUTPUT_DIR/"
            
            TARBALL="dist/freshen_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
            tar -czvf "$TARBALL" -C "dist" "freshen_${VERSION}_${GOOS}_${GOARCH}"
          done

      - name: Build Windows archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          WIN_ARCHS=("amd64" "arm64")

          for ARCH in "${WIN_ARCHS[@]}"; do
            OUTPUT_DIR="dist/freshen_${VERSION}_windows_${ARCH}"
            mkdir -p "$OUTPUT_DIR"
            
            GOOS=windows GOARCH=$ARCH go build -ldflags "-X main.Version=${VERSION}" -o "${OUTPUT_DIR}/freshen.exe" .
            cp LICENSE README.md "$OUTPUT_DIR/"
            
            (cd dist && zip -r "freshen_${VERSION}_windows_${ARCH}.zip" "freshen_${VERSION}_windows_${ARCH}")
          done

      - name: Generate Checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
