name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
# Releases push to the shared homebrew-tap repository, so two tags must never
# publish at once. Group on the repository (not the ref) and never cancel a
# run that may already have published.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      # Fail before anything is published: without this secret the release
      # and archives would go out and only the final tap push would fail.
      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set. Add a repository or organization secret with contents:write on seankoji-com/homebrew-tap, then re-run this workflow."
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: {distribution: goreleaser, version: v2.18.2}
        env:
          # Publishes the GitHub release in this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN cannot write to another repository, so the formula
          # push to seankoji-com/homebrew-tap needs its own token with
          # contents:write on that repo (see .goreleaser.yaml brews.repository).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
