version: "2"
linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
